services:
  swipy-postgres:
    image: postgres:18.1-bookworm
    container_name: swipy-env-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql
    restart: always

  swipy-migrate:
    image: migrate/migrate:v4.20.1
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations
    restart: always

  port-forwarder:
    image: alpine/socat:1.8.0.3
    container_name: swipy-posgtres-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:swipy-env-postgres:5432
    ports:
      - "127.0.0.1:5432:5432"
